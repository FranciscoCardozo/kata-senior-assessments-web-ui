<div class="assessment-response-container">
  <div class="form-container" *ngIf="!idAssessment">
    <div class="form-content">
      <div class="title-container">
        <p class="title">Por favor ingresa la información correspondiente del examen a responder: </p>
      </div>
      <div class="input-container">
        <label for="questionText">Ingrese el Id del formulario a contestar:</label>
        <input
          type="text"
          id="questionText"
          name="questionText"
          (input)="validateInputHandler($event)"
        >
        <div class="error-message">
          <p>Ingresa un Id valido</p>
        </div>
      </div>
      <div class="button-container">
        <button
          type="button"
          (click)="getAssessmentInfo()">
          Consultar
        </button>
      </div>
    </div>
  </div>
  <div class="assessment-container" *ngIf="filteredQuestions">
    <div class="content">
      <div class="question-container" *ngFor="let question of filteredQuestions">
        <div class="type-container">{{question.type}}</div>
        <div class="difficulty-container">{{question.difficulty}}</div>
        <div class="title-container">
          {{question.text}}
        </div>
        <div class="response-field-container" *ngIf="question.type === 'open'">
          <input
            type="text"
            id="questionText"
            name="questionText"
            (input)="validateResponseHandler($event, question)"
            >
        </div>
        <div class="response-radio-container" *ngIf="question.type === 'multiple'">
             <div class="options-container" *ngFor="let option of question.options">
              <label>
                <input
                  type="radio"
                  name="language"
                  [value]="option"
                  (change)="selectRadioOption($event, question)"
                >
                  {{option}}
              </label>
             </div>
        </div>
        <div class="response-code-container" *ngIf="question.type === 'coding'">
          <app-sandbox
            (sourceCode)="sendCode($event, question)"
            [responseCode]="responseCode"
          ></app-sandbox>
        </div>
      </div>
    </div>
  </div>
  <div class="button-result-container">
    <button
        type="button"
        (click)="getResults()">
      Terminar Prueba
    </button>
  </div>
</div>
